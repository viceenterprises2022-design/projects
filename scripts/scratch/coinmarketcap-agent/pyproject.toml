[project]
name = "coinmarketcap_agent"
version = "0.1.0"
description = "Specialized Coinmarketcap AI Agent with 8-layer defense harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.0.10",
    "langchain-core>=0.1.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0"
]

[tool.setuptools.packages.find]
include = ["agent*", "app*", "security*"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
