version: '3.8'

services:
  saas-web:
    build: .
    container_name: saas-multi-web
    ports:
      - "8900:8900"
    environment:
      - WEBHOOK_SECRET_TOKEN=supersecret_webhook_token
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SaaS_ENCRYPTION_KEY=${SaaS_ENCRYPTION_KEY}
      - SaaS_JWT_SECRET=${SaaS_JWT_SECRET}
    volumes:
      - .:/app
    restart: always

  redis:
    image: redis:7-alpine
    container_name: saas-multi-redis
    ports:
      - "6379:6379"
    restart: always
